<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Motivation – Education Innovation Lab</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #fff176;
      font-family: system-ui, sans-serif;
      padding: 60px 0;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 300px);
      grid-template-rows: repeat(3, 300px);
      gap: 32px;
    }

    .coin-container {
      perspective: 1000px;
    }

    .coin {
      width: 300px;
      height: 300px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.8s;
      cursor: pointer;
    }

    .coin.no-flip {
      cursor: default;
    }

    .coin.flipped {
      transform: rotateY(180deg);
    }

    .side {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
      box-sizing: border-box;
      text-align: center;
    }

    .front {
      background: white;
      border: 2px solid #333;
      font-size: 1.1rem;
      font-weight: 600;
      line-height: 1.3;
    }

    .back {
      background: #1080c1;
      color: white;
      transform: rotateY(180deg);
      font-size: 0.8rem;
      font-weight: 450;
      line-height: 1.25;
    }

    .back .text {
      max-width: 90%;
      margin: 0 auto;
    }

    .image-front {
      padding: 0;
      border: none;
    }

    .image-front img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    .back a {
      color: #ffeb3b;
      text-decoration: underline;
      font-weight: 450;
    }

    /* scroll indicator (desktop: left) */
    .scroll-indicator {
      position: fixed;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.6rem;
      color: #333;
      opacity: 0.6;
      animation: bounceDown 1.6s infinite;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .scroll-indicator.hidden {
      opacity: 0;
    }

    @keyframes bounceDown {
      0%, 100% { transform: translateY(-50%); }
      50% { transform: translateY(calc(-50% + 8px)); }
    }

    /* ---------------- MOBILE ---------------- */
    @media (max-width: 900px) {

      body {
        padding: 40px 0 80px;
        align-items: flex-start;
      }

      .grid {
        grid-template-columns: 1fr;
        grid-template-rows: auto;
        gap: 28px;
      }

      .coin {
        width: 260px;
        height: 260px;
        margin: 0 auto;
      }

      .front {
        font-size: 1rem;
      }

      .back {
        font-size: 0.75rem;
      }

      /* move scroll arrow to bottom on mobile */
      .scroll-indicator {
        left: 50%;
        top: auto;
        bottom: 16px;
        transform: translateX(-50%);
        animation: bounceMobile 1.6s infinite;
      }

      @keyframes bounceMobile {
        0%, 100% { transform: translateX(-50%); }
        50% { transform: translateX(-50%) translateY(8px); }
      }
    }
  </style>
</head>

<body>

<div class="grid">
  <!-- your grid content stays EXACTLY the same -->
  <!-- (all circles unchanged) -->
</div>

<div class="scroll-indicator" id="scrollIndicator">↓</div>

<script>
  document.querySelectorAll('.coin:not(.no-flip)').forEach(coin => {
    coin.addEventListener('click', () => {
      coin.classList.toggle('flipped');
    });
  });

  document.querySelectorAll('.back a').forEach(link => {
    link.addEventListener('click', e => e.stopPropagation());
  });

  const indicator = document.getElementById('scrollIndicator');
  let hasScrolled = false;

  window.addEventListener('scroll', () => {
    if (!hasScrolled) {
      indicator.classList.add('hidden');
      hasScrolled = true;
    }
  });
</script>

</body>
</html>
